<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BLIS/MLIS राष्ट्रीय पात्रता परीक्षा पोर्टल (NTA Look)</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <div class="logo-title">💻 BLIS & MLIS कंप्यूटर आधारित परीक्षा (CBT)</div>
    <div class="header-right">
        <!-- टेस्ट सेट चुनने का विकल्प -->
        <label for="test-set-select" style="color: white; margin-right: 10px;">टेस्ट सेट चुनें:</label>
        <select id="test-set-select" onchange="loadSelectedTest()">
            <!-- JS द्वारा यहाँ 15 टेस्ट लोड होंगे -->
        </select>
        <div id="user-info" style="margin-left: 20px;">परीक्षार्थी: BLIS Candidate</div>
    </div>
</header>

<div class="main-container">
    <!-- प्रश्न और विकल्प क्षेत्र -->
    <div class="quiz-area">
        <div class="test-header-bar">
            <span id="current-topic-display">विषय: पुस्तकालय विज्ञान</span>
        </div>
        <div id="questions-container">
            <!-- JavaScript द्वारा यहाँ चुनी गई टेस्ट सीरीज़ लोड होगी -->
        </div>
        
        <div class="nav-buttons">
            <button class="nav-btn prev-btn" onclick="changeQuestion(-1)">← Previous</button>
            <button class="nav-btn review-btn" onclick="markForReview()">⭐ Mark for Review</button>
            <button class="nav-btn next-btn" onclick="changeQuestion(1)">Save & Next →</button>
        </div>
    </div>

    <!-- राइट साइडबार -->
    <div class="sidebar">
        <div class="timer">समय शेष: <span id="time-display">90:00</span></div>
        
        <div class="score-board">
            <h4>📊 परीक्षा प्रोग्रेस रिपोर्ट</h4>
            <div class="stats-grid">
                <div>कुल प्रश्न: <span id="total-questions">100</span></div>
                <div>उत्तर दिए: <span id="total-answered">0</span></div>
                <div>रिव्यू मार्क: <span id="total-reviewed">0</span></div>
            </div>
            
            <!-- फाइनल रिजल्ट बॉक्स (सबमिट के बाद दिखेगा) -->
            <div id="final-result-box">
                <h4>🎯 फाइनल स्कोर कार्ड</h4>
                <p class="res-correct">सही उत्तर: <span id="correct-count">0</span></p>
                <p class="res-wrong">गलत उत्तर: <span id="wrong-count">0</span></p>
                <p class="res-percent">कुल प्रतिशत: <span id="percentage-score">0%</span></p>
            </div>
        </div>

        <div class="palette-container">
            <h3>🧩 प्रश्न पैलेट (Question Palette)</h3>
            <div class="palette" id="question-palette"></div>
        </div>
        <button class="submit-btn" onclick="submitExam()">🔒 परीक्षा सबमिट करें</button>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
